<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  10.98.103.49
  <style>
    body { font-family: Arial; padding: 20px; background: #0d0d0d; color: #00ffcc; }
    input, button { font-size: 1.2em; padding: 10px; width: 100%; margin-top: 10px; }
    #respuesta { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🧠 El Núcleo</h1>
  <p>Escribe tu pregunta o instrucción:</p>
  <input id="entrada" placeholder="Ej: busca patrones en..." />
  <button onclick="enviar()">Enviar</button>
  <div id="respuesta"></div>

  <script>
    async function enviar() {
      const entrada = document.getElementById('entrada').value;
      const res = await fetch('http://TU_SERVIDOR:3000/api/prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: entrada })
      });
      const data = await res.json();
      document.getElementById('respuesta').innerText = data.answer || 'Sin respuesta';
    }
  </script>
</body>
</html
